<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web-3-Login</title>
  <!-- Font -->
  <link rel="stylesheet" href="font/font.css">
  <!-- CSS -->
  <link rel="stylesheet" href="webSignIn-css/header.css" type="text/css" />
  <link rel="stylesheet" href="webSignIn-css/signIn-email-password.css" title="" type="" />
  <link rel="stylesheet" href="webSignIn-css/line.css" title="" type="" />
  <link rel="stylesheet" href="webSignIn-css/option.css" title="" type="" />
</head>

<body>
  <div class="mainSignInContainer">
    <div class="signInHeader">
      <img id="headerLogo"src="image/logo-archena.png" alt="Login" />
      <h3 id="headerTitle">Sign in</h3>
      <p id="headerText">Enter your email and password below to sign in</p>
    </div>
    
    <div>
    <form class="signInEPContainer" name="SignInEmail" action="" metaccept-charset="utf-8">
      <label class="signInLabel" for="email">Email</label>
      
      <input class="signInInput" type="text" name="email" id="email" placeholder="tasqiii10@gmail.com">
      
      <label class="signInLabel" for="password">Password</label>
      
      <input class="signInInput" type="password" name="password" id="password" placeholder="Enter password">
      
      <button id="signInSubmit" type="submit">Sign in</button>
    </form>
    </div>
    
    <div class="lineContainer">
      <hr class="line">
      <p id="lineText">Or</p>
      <hr class="line">
    </div>
    
    <div class="optionContainer">
      <div class="optionApple">
        <a class="optionText" href="">
          <img class="optionImage" src="image/apple-logo-2.png" alt="apple logo" />
          Continue with Apple
        </a>
      </div>
    </div>
  </div>
</body>

</html>
