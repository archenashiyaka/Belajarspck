<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web-3-Login</title>
  <!-- Font -->
  <link rel="stylesheet" href="font/font.css">
  <!-- CSS -->
  <link rel="stylesheet" href="webSignIn-css/web-sign-in-header.css" type="text/css" />
</head>

<body>
  <div class="mainSignInContainer">
    <div class="SignInHeader">
      <img id="headerLogo"src="image/logo-archena.png" alt="Login" />
      <h3 id="headerTitle">Sign in</h3>
      <p id="headerText">Enter your email and password below to sign in</p>
    </div>
    
    <div>
    <form class="SignInEPContainer" name="SignInEmail" action="" metaccept-charset="utf-8">
      <label for="email" class="SignInEP">Email</label>
      <br>
      <input type="text" name="email" id="email">
      <br>
      <label for="password" class="SignInEP">Password</label>
      <br>
      <input type="text" name="password" id="password">
      <br>
      <button type="submit">Sign in</button>
    </form>
    </div>
  </div>
</body>

</html>
